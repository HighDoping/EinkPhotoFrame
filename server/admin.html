<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-ink Photo Frame Admin</title><style>
:root{color-scheme:light;--bg:#f5f7f4;--surface:#ffffff;--surface2:#eef4ee;--line:#c5d2c5;--text:#1f2a21;--muted:#607064;--ok:#4f8a54;--warn:#d6a72f;--danger:#c95b4d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:30px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1,h2,p{margin-top:0}h1{margin-bottom:4px}.sub,small{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 8px 22px #24302512}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:var(--surface2);border-radius:11px;padding:13px}.metric b{font-size:1.55rem;display:block}.toolbar,form,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select,button{font:inherit;border-radius:8px;padding:9px 10px;border:1px solid var(--line);background:#fff;color:var(--text)}select{-webkit-appearance:menulist;appearance:menulist;color-scheme:light}select option{background:#fff;color:var(--text)}input{min-width:150px}button{cursor:pointer;background:var(--ok);color:#fff;border:0;font-weight:700}button.secondary{background:#dce8dd;color:var(--text)}button.danger{background:var(--danger)}button.warning{background:var(--warn);color:#3a2b05}.device{border-top:1px solid var(--line);padding:17px 0}.device:first-child{border-top:0;padding-top:3px}.device-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.name{font-size:1.1rem;font-weight:700}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:.76rem;border-radius:999px;padding:3px 8px;background:#dce8dd}.badge.offline{background:#f2e4bf}.badge.revoked{background:#f1d5d1}.details{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px;margin:14px 0}.details div{background:#f7faf7;border-radius:8px;padding:8px;color:var(--muted);font-size:.8rem}.details b{display:block;color:var(--text);font-size:.92rem;overflow-wrap:anywhere;margin-top:3px}.current-image{display:flex;align-items:center;gap:8px}.current-image img{width:72px;height:54px;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:var(--surface2)}.settings{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:9px;margin-top:12px}.settings label{color:var(--muted);font-size:.8rem}.settings input,.settings select{display:block;width:100%;margin-top:4px;min-width:0}.settings label.toggle{display:flex;align-items:center;gap:7px;padding-top:22px;color:var(--text)}.settings label.toggle input{display:inline;width:auto;margin:0;min-width:auto}.hidden{display:none}.notice{min-height:20px;color:var(--ok)}.error{color:var(--danger)}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.details,.settings{grid-template-columns:repeat(2,1fr)}header{align-items:start;flex-direction:column}}
</style></head><body><main><header><div><h1>E-ink Photo Frame</h1><div class="sub">Private device image delivery and fleet status</div></div><button class="secondary" id="logout">Lock dashboard</button></header>
<section id="login" class="card"><h2>Admin access</h2><form id="loginForm"><input id="key" type="password" placeholder="ADMIN_KEY" required autofocus><button>Unlock</button></form><div id="message" class="notice"></div></section>
<section id="app" class="hidden"><div class="grid" id="metrics"></div><div class="card"><h2>Approve a device</h2><p class="sub">Use the exact MAC address and firmware device name. A random start position is assigned automatically.</p><form id="createForm"><input id="newId" placeholder="MAC address / device ID" required><input id="newName" placeholder="Firmware device name" required><button>Approve device</button></form></div><div class="card"><div class="toolbar"><h2 style="margin:0">Devices</h2><input id="search" placeholder="Filter name or MAC"><button class="secondary" id="refresh">Refresh</button></div><div id="devices"></div></div></section></main><script>
let key=sessionStorage.adminKey||'',all=[],drafts=JSON.parse(sessionStorage.adminDrafts||'{}');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+key};if(opts.body)opts.headers['Content-Type']='application/json';const r=await fetch(path,opts),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.statusText);return j.data}
const online=d=>d.telemetry?.last_seen&&Date.now()-new Date(d.telemetry.last_seen)<15*60e3;const date=v=>v?new Date(v).toLocaleString():'Never';const short=v=>v?v.slice(0,12)+'…':'—';
function metric(n,l){return `<div class="metric"><b>${n}</b><span class="sub">${l}</span></div>`}function field(label,name,value,type='number',min=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}"${min!==''?` min="${min}"`:''} required></label>`}function selectField(label,name,value,choices){return `<label>${label}<select name="${name}">${choices.map(v=>`<option value="${esc(v)}"${String(v)===String(value)?' selected':''}>${esc(v)}</option>`).join('')}</select></label>`}function toggleField(label,name,enabled){return `<label class="toggle"><input name="${name}" type="checkbox"${enabled?' checked':''}>${label}</label>`}
function deviceCard(d){const s=d.settings||{},state=!d.enabled?'Revoked':d.authorized?(online(d)?'Online':'Offline'):'Awaiting enrollment',style=!d.enabled?'revoked':d.authorized?(online(d)?'':'offline'):'offline',access=d.enabled?'<button type="button" class="danger revoke">Revoke access</button>':'<button type="button" class="secondary enable">Allow enrollment</button>',current=d.current_image?`<div class="current-image"><img class="currentImage" data-id="${esc(d.device_id)}" alt="Current image"><span title="${esc(d.current_image.uuid)}">${esc(d.current_image.name)}</span></div>`:'<b>—</b>',refresh=Number(s.img_update_interval)>0?s.img_update_interval:600,palettes=['7Standard','7Eink'],algorithms=['Atkinson','Burkes','FalseFloydSteinberg','FloydSteinberg','JarvisJudiceNinke','Sierra','Sierra2','Sierra2_4A','Sierra3','SierraLite','Simple2D','StevenPigeon','Stucki','TwoRowSierra','ClusteredDot4x4','ClusteredDot6x6','ClusteredDot6x6_2','ClusteredDot6x6_3','ClusteredDot8x8','ClusteredDotDiagonal16x16','ClusteredDotDiagonal6x6','ClusteredDotDiagonal8x8','ClusteredDotDiagonal8x8_2','ClusteredDotDiagonal8x8_3','ClusteredDotHorizontalLine','ClusteredDotSpiral5x5','ClusteredDotVerticalLine','Horizontal3x5','Vertical5x3'];return `<article class="device" data-id="${esc(d.device_id)}"><div class="device-head"><div><div class="name">${esc(d.device_name)}</div><small>${esc(d.device_id)}</small></div><div class="badges"><span class="badge ${style}">${state}</span><span class="badge">${d.asset_count} private assets</span></div></div><div class="details"><div>Last seen<b>${date(d.telemetry?.last_seen)}</b></div><div>Battery<b>${d.telemetry?.battery_level??'—'}%</b></div><div>Display (device-reported)<b>${s.width??'—'} × ${s.height??'—'}</b></div><div>Current image${current}</div><div>Start position<b>${d.start_index}</b></div></div><form class="settingsForm"><div class="settings">${field('Refresh (seconds)','img_update_interval',refresh,'number',1)}${selectField('Rotation','rotation',s.rotation??0,['0','90','180','270'])}${selectField('Palette','palette',s.palette??'7Standard',palettes)}${selectField('Dither algorithm','dither_algorithm',s.dither_algorithm??'StevenPigeon',algorithms)}${field('Dither strength','dither_strength',s.dither_strength??1,'number',0)}${toggleField('Auto brightness','auto_brightness',s.auto_brightness??true)}${toggleField('Auto contrast','auto_contrast',s.auto_contrast??true)}${selectField('Resize method','resize_method',s.resize_method??'cut',['cut','fill_white','fill_black'])}</div><div class="actions"><input name="device_name" value="${esc(d.device_name)}" aria-label="Device name" required><button>Save settings</button><button type="button" class="warning reset">New image start</button>${access}<button type="button" class="danger remove">Delete device</button></div></form></article>`}
function loadCurrentPreviews(){document.querySelectorAll('.currentImage').forEach(async img=>{try{const r=await fetch('/admin/api/devices/'+encodeURIComponent(img.dataset.id)+'/current-image',{headers:{Authorization:'Bearer '+key}});if(!r.ok)throw Error();img.src=URL.createObjectURL(await r.blob())}catch{img.replaceWith(Object.assign(document.createElement('span'),{textContent:'Preview unavailable',className:'sub'}))}})}
function saveDraft(form){const draft={};new FormData(form).forEach((value,name)=>draft[name]=value);['auto_brightness','auto_contrast'].forEach(name=>draft[name]=form.elements[name].checked);drafts[form.closest('.device').dataset.id]=draft;sessionStorage.adminDrafts=JSON.stringify(drafts)}function restoreDrafts(){document.querySelectorAll('.settingsForm').forEach(form=>{const draft=drafts[form.closest('.device').dataset.id];if(!draft)return;Object.entries(draft).forEach(([name,value])=>{const field=form.elements[name];if(!field)return;if(field.type==='checkbox')field.checked=value===true||value==='true';else field.value=value})})}
function render(){const query=$('search').value.toLowerCase(),items=all.filter(d=>(d.device_name+' '+d.device_id).toLowerCase().includes(query));const active=all.filter(d=>d.authorized).length,on=all.filter(d=>d.authorized&&online(d)).length;$('metrics').innerHTML=metric(all.length,'Approved devices')+metric(active,'Authorized')+metric(on,'Online now')+metric(all.reduce((n,d)=>n+d.asset_count,0),'Private generated assets');$('devices').innerHTML=items.length?items.map(deviceCard).join(''):'<p class="sub">No matching devices.</p>';restoreDrafts();loadCurrentPreviews()}
async function load(){const data=await api('/admin/api/devices');all=data.devices||[];render()}
$('loginForm').onsubmit=async e=>{e.preventDefault();key=$('key').value;try{await load();sessionStorage.adminKey=key;$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){key='';$('message').textContent='Error: '+e.message;$('message').className='notice error'}};
$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('search').oninput=render;$('logout').onclick=()=>{key='';sessionStorage.removeItem('adminKey');$('app').classList.add('hidden');$('login').classList.remove('hidden');$('key').value=''};
$('createForm').onsubmit=async e=>{e.preventDefault();try{await api('/admin/api/devices',{method:'POST',body:JSON.stringify({device_id:$('newId').value,device_name:$('newName').value})});e.target.reset();await load()}catch(e){alert(e.message)}};
$('devices').onclick=async e=>{const row=e.target.closest('.device');if(!row)return;try{if(e.target.classList.contains('revoke')){if(!confirm('Revoke this device and disable further enrollment?'))return;await api('/admin/api/devices/'+encodeURIComponent(row.dataset.id)+'/revoke',{method:'POST'})}if(e.target.classList.contains('enable'))await api('/admin/api/devices/'+encodeURIComponent(row.dataset.id)+'/enable',{method:'POST'});if(e.target.classList.contains('reset')){if(!confirm('Clear assigned assets and select a new random image start?'))return;await api('/admin/api/devices/'+encodeURIComponent(row.dataset.id)+'/reset-image',{method:'POST'})}if(e.target.classList.contains('remove')){if(!confirm('Delete this device, its settings, status, and private asset assignments? This cannot be undone.'))return;await api('/admin/api/devices/'+encodeURIComponent(row.dataset.id),{method:'DELETE'})}await load()}catch(e){alert(e.message)}};
$('devices').oninput=e=>{const form=e.target.closest('.settingsForm');if(form)saveDraft(form)};$('devices').onchange=e=>{const form=e.target.closest('.settingsForm');if(form)saveDraft(form)};
$('devices').onsubmit=async e=>{if(!e.target.classList.contains('settingsForm'))return;e.preventDefault();const row=e.target.closest('.device'),f=new FormData(e.target),settings={};['img_update_interval','rotation','dither_strength'].forEach(k=>settings[k]=Number(f.get(k)));['auto_brightness','auto_contrast'].forEach(k=>settings[k]=f.get(k)==='on');['palette','dither_algorithm','resize_method'].forEach(k=>settings[k]=f.get(k));try{await api('/admin/api/devices/'+encodeURIComponent(row.dataset.id),{method:'PATCH',body:JSON.stringify({device_name:f.get('device_name'),settings})});delete drafts[row.dataset.id];sessionStorage.adminDrafts=JSON.stringify(drafts);await load()}catch(e){alert(e.message)}};
if(key){$('login').classList.add('hidden');$('app').classList.remove('hidden');load().catch(()=>$('logout').click())}
</script></body></html>
